# Agent Engineering Hub Workflow Content Module Expansion

## Action

Follow the content-module-expansion workflow:
1. Create new .md files for each subpage under docs/guide/<module>/
2. Update docs/.vitepress/config.ts to reflect new sidebar structure and navigation
3. If applicable, create or update English versions under docs/en/guide/<module>/
4. Run tests to validate links, routes, and frontmatter
5. Build docs to ensure no warnings or errors

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: docs/guide/*/*.md, docs/.vitepress/config.ts, docs/en/guide/*/*.md

